; Konfigurasi PHP untuk Vercel Serverless
extension=pdo.so
extension=pdo_sqlite.so
extension=sqlite3.so
extension=mbstring.so
extension=openssl.so
extension=tokenizer.so
extension=xml.so
extension=ctype.so
extension=fileinfo.so
extension=curl.so
extension=zip.so

; Error reporting — tampilkan ke stderr saja
display_errors = Off
log_errors = On
error_log = /dev/stderr

; Batas memori dan waktu
memory_limit = 512M
max_execution_time = 30

; Timezone
date.timezone = Asia/Jakarta
